<html lang="tr">
<head>
  <meta charset="UTF-8">

  <title>ProblemDEDE</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Üst Header ve Panoramik SVG Banner */
    .site-header {
      width: 100%;
      height: 140px;
      overflow: hidden;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .panoramic-logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Breadcrumb (Yol Çubuğu) Alanı */
    .breadcrumb-container {
      max-width: 1200px;
      width: 100%;
      margin: 20px auto 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .breadcrumb-item {
      cursor: pointer;
      color: var(--primary-color);
      transition: color 0.2s;
    }

    .breadcrumb-item:hover {
      text-decoration: underline;
      color: var(--primary-hover);
    }

    .breadcrumb-separator {
      color: #94a3b8;
    }

    .breadcrumb-current {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Ana İçerik ve Grid Yapısı */
    main {
      max-width: 1200px;
      width: 100%;
      margin: 20px auto 40px auto;
      padding: 0 20px;
      flex: 1;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    /* Kart Tasarımları */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border-color: var(--primary-color);
    }

    /* Kart İçi SVG Alanı (300x300 oranlı esnek kutu) */
    .card-svg-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 200px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      border-radius: 8px;
      overflow: hidden;
    }

    .card-svg-wrapper svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 14px;
      margin-top: auto;
    }
  </style>
</head>

    let historyStack = [siteData];

    function render() {
          const currentNode = historyStack[historyStack.length - 1];
          
          // Başlık Güncelleme
          document.getElementById('section-title').textContent = currentNode.title;

          // Breadcrumb Güncelleme (Breadcrumb mantığını bozmadan koruduk)
          const breadcrumbEl = document.getElementById('breadcrumb');
          breadcrumbEl.innerHTML = '';
          
          historyStack.forEach((node, index) => {
            if (index > 0) {
              const sep = document.createElement('span');
              sep.className = 'breadcrumb-separator';
              sep.textContent = '>';
              breadcrumbEl.appendChild(sep);
            }

            const item = document.createElement('span');
            if (index === historyStack.length - 1) {
              item.className = 'breadcrumb-current';
              item.textContent = node.title;
            } else {
              item.className = 'breadcrumb-item';
              item.textContent = node.title;
              item.onclick = () => {
                historyStack = historyStack.slice(0, index + 1);
                render();
              };
            }
            breadcrumbEl.appendChild(item);
          });

          // Grid Kartlarını Oluşturma (Geri dönüş yapısını bozmadan sadece img kontrolü ekledik)
          const container = document.getElementById('grid-container');
          container.innerHTML = '';

          if (!currentNode.children || currentNode.children.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:40px;">Bu klasör henüz boş.</p>';
            return;
          }

          currentNode.children.forEach(child => {
            // --- SADECE BU SATIR EKLENDİ ---
            const cardVisual = child.img 
                ? `<img src="${child.img}" alt="${child.title}" style="width:100%; height:100%; object-fit:cover;">` 
                : getCardSvg(child.title);
            // ------------------------------

            if (child.type === 'link') {
              const a = document.createElement('a');
              a.className = 'card';
              a.href = child.url;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.innerHTML = `
                <div class="card-svg-wrapper">${cardVisual}</div>
                <div class="card-title">${child.title}</div>
                <div class="card-desc">${child.description || 'İçeriği Görüntüle / İndir'}</div>
              `;
              container.appendChild(a);
            } else {
              const div = document.createElement('div');
              div.className = 'card';
              div.onclick = () => {
                historyStack.push(child);
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
              };
              div.innerHTML = `
                <div class="card-svg-wrapper">${cardVisual}</div>
                <div class="card-title">${child.title}</div>
                <div class="card-desc">${child.description || 'Alt kategorileri incele'}</div>
              `;
              container.appendChild(div);
            }
          });
        }

    // Sayfa ilk açıldığında çalıştır
    render();
  </script>
</body>
</html>
